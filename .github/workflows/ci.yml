name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - run: dotnet pack src/Docfx.RemoteInclude/Docfx.RemoteInclude.csproj -c Release -o artifacts
      - run: dotnet pack src/Docfx.RemoteInclude.Cli/Docfx.RemoteInclude.Cli.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.nupkg
