name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      - run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Docfx.RemoteInclude/Docfx.RemoteInclude.csproj -c Release --no-build -o artifacts
          dotnet pack src/Docfx.RemoteInclude.Cli/Docfx.RemoteInclude.Cli.csproj -c Release --no-build -o artifacts

      - name: NuGet login (trusted publishing via OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: supramo

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
